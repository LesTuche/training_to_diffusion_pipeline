[[stage]]
module = "run_md"
name = "opes"
presets = ["finetuned", "md"]
inputs = ["data_gen_md"]
plumed = { pt36c5 = "<path/to/examples/plumed/alpha_ptc.dat>", pt18ga18c5 = "<path/to/examples/plumed/alpha_ptga_dop.dat>" }
nsteps = 3000000
write_interval_fs = 100.0

[[stage]]
module = "opes_minimum"
name = "opes_minimum"
temperature_K = 873.0
colvar_stride = 10

[[stage]]
module = "run_md"
name = "diffusion"
presets = ["finetuned", "md"]
nsteps = 2500000
write_interval_fs = 10.0
