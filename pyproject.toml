[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "training_to_diffusion_pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ase<=3.30.0b1",
    "mace-torch",
    "torch",
    "torch_geometric",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "tidynamics",
    "tqdm",
    "packaging",
    "plumed",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pipeline"]

[tool.autopep8]
max_line_length = 79
in-place = true
recursive = true
exclude = "third_party"
# autopep8's default ignore list plus E402: stage_utils imports pyplot only after matplotlib.use("Agg")
ignore = ["E226", "E24", "W50", "W690", "E402"]
