run_dir = "run_multi"

[[stage]]
module = "run_md"
name = "md"
model = "<path/to/compiled.model>"
device = "cpu"
default_dtype = "float32"
temperature_K = 873.0
timestep_fs = 1.0
taut_fs = 20.0
write_interval_fs = 10.0
log_interval_fs = 10.0
nsteps = 2
seed = 1
inputs = ["pt36c1_start.traj", "pt18ga18c5_start.traj"]
