run_dir = "run_fail"

[[stage]]
module = "generate_cluster"
name = "cluster"
model = "<path/to/compiled.model>"
device = "cpu"
default_dtype = "float32"
radius = 10.0
seed = 42
fmax = 0.1
opt_max_steps = 2
temperature_K = 873.0
timestep_fs = 1.0
taut_fs = 20.0
equilibration_nsteps = 2
write_interval_fs = 10.0
log_interval_fs = 10.0

[stage.clusters.pt36c1]
composition = { Pt = 36, C = 1 }

[stage.clusters.unplaceable]
composition = { Pt = 36, C = 1 }
radius = 1.0
